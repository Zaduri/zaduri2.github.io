    <title>Тест по информатике</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .start-screen {
            text-align: center;
        }
        
        .start-screen h2 {
            font-size: 1.8em;
            margin-bottom: 30px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .timer {
            position: sticky;
            top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 100;
        }
        
        .timer.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .question {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        
        .question-text {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .option input[type="radio"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .option label {
            cursor: pointer;
            flex: 1;
            font-size: 1em;
        }
        
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 30px;
            text-decoration: none;
            text-align: center;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            margin-top: 15px;
        }
        
        .btn-email {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 15px;
        }
        
        .result {
            display: none;
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-top: 30px;
        }
        
        .result h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .score {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .progress {
            background: rgba(255,255,255,0.2);
            height: 10px;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: white;
            transition: width 0.5s;
        }
        
        .student-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        
        .student-info p {
            margin: 10px 0;
            font-size: 1.1em;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .content {
                padding: 20px;
            }
            
            .question {
                padding: 15px;
            }
            
            .timer {
                font-size: 1.2em;
                padding: 10px 20px;
            }
        }
    </style>
</head>

                options: ["конструкция для повторения действий определённое количество раз или пока выполняется определённое условие", "способ хранения данных в памяти компьютера", "метод передачи данных по сети", "вид оператора условия"],
                correct: 0
            },
            {
                q: "Как называется устройство, которое используется для вывода звуковой информации с компьютера?",
                options: ["микрофон", "колонки", "веб-камера", "сканер"],
                correct: 1
            },
            {
                q: "Что такое облачное хранилище данных?",
                options: ["устройство для хранения данных на компьютере", "сервис для хранения данных на удалённых серверах с доступом через интернет", "программа для создания резервных копий данных", "способ шифрования данных"],
                correct: 1
            },
            {
                q: "Какой из перечисленных протоколов используется для отправки электронной почты?",
                options: ["FTP", "HTTP", "SMTP", "TCP/IP"],
                correct: 2
            }
        ];

        let studentData = {
            lastName: '',
            firstName: '',
            group: '',
            startTime: null,
            endTime: null,
            score: 0,
            totalQuestions: questions.length,
            answers: []
        };

        let timerInterval;
        let timeLeft = 60 * 60;

        function startQuiz() {
            const lastName = document.getElementById('lastName').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const group = document.getElementById('group').value.trim();

            if (!lastName || !firstName || !group) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            studentData.lastName = lastName;
            studentData.firstName = firstName;
            studentData.group = group;
            studentData.startTime = new Date();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');

            createQuiz();
            startTimer();
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('Время вышло! Тест будет завершён автоматически.');
                    finishQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerElement = document.getElementById('timer');
            timerElement.textContent = `⏱️ Время: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft <= 300 && timeLeft > 0) {
                timerElement.classList.add('warning');
            }
        }

        function createQuiz() {
            const form = document.getElementById('quizForm');
            questions.forEach((question, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="question-text">${index + 1}. ${question.q}</div>
                    <div class="options">
                        ${question.options.map((option, optIndex) => `
                            <div class="option">
                                <input type="radio" name="q${index}" id="q${index}_${optIndex}" value="${optIndex}">
                                <label for="q${index}_${optIndex}">${option}</label>
                            </div>
                        `).join('')}
                    </div>
                `;
                form.appendChild(questionDiv);
            });
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            studentData.endTime = new Date();

            let score = 0;
            const total = questions.length;
            studentData.answers = [];
            
            questions.forEach((question, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const options = document.querySelectorAll(`input[name="q${index}"]`);
                
                let isCorrect = false;
                let selectedAnswer = -1;
                
				/* 🔽 ЗАКОММЕНТИРОВАНО - подсветка ответов отключена
                options.forEach((opt, optIndex) => {
                    const label = opt.parentElement;
                    if (optIndex === question.correct) {
                        label.classList.add('correct');
                    }
                    if (selected && optIndex === parseInt(selected.value)) {
                        selectedAnswer = optIndex;
                        if (optIndex !== question.correct) {
                            label.classList.add('incorrect');
                        }
                    }
                });
				🔼 КОНЕЦ ЗАКОММЕНТИРОВАННОГО БЛОКА */
                
                if (selected && parseInt(selected.value) === question.correct) {
                    score++;
                    isCorrect = true;
                }
                
                studentData.answers.push({
                    question: question.q,
                    selected: selectedAnswer,
                    correct: question.correct,
                    isCorrect: isCorrect
                });
            });

            studentData.score = score;
            showResults(score, total);
        }

        function showResults(score, total) {
            const percentage = Math.round((score / total) * 100);
            const timeSpent = Math.round((studentData.endTime - studentData.startTime) / 1000);
            const minutes = Math.floor(timeSpent / 60);
            const seconds = timeSpent % 60;

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h2>Результат теста</h2>
                <div class="student-info">
                    <p><strong>Студент:</strong> ${studentData.lastName} ${studentData.firstName}</p>
                    <p><strong>Группа:</strong> ${studentData.group}</p>
                    <p><strong>Время прохождения:</strong> ${minutes} мин ${seconds} сек</p>
                </div>
                <div class="score">${score} / ${total}</div>
                <div class="progress">
                    <div class="progress-bar" style="width: ${percentage}%"></div>
                </div>
                <p style="font-size: 1.5em; margin-top: 20px;">${percentage}% правильных ответов</p>
                <p style="font-size: 1.3em; margin-top: 10px;"><strong>Оценка: ${getGrade(percentage)}</strong></p>
                <button class="btn btn-secondary" onclick="saveResults()">💾 Сохранить результаты в файл</button>
                <button class="btn btn-email" onclick="sendResultsByEmail()">📧 Отправить результаты преподавателю</button>
                <button class="btn" onclick="location.reload()" style="margin-top: 15px;">Пройти тест заново</button>
            `;
            
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function saveResults() {
            const timeSpent = Math.round((studentData.endTime - studentData.startTime) / 1000);
            const minutes = Math.floor(timeSpent / 60);
            const seconds = timeSpent % 60;
            const percentage = Math.round((studentData.score / studentData.totalQuestions) * 100);

            const content = `
РЕЗУЛЬТАТЫ ТЕСТА ПО ИНФОРМАТИКЕ
================================

Студент: ${studentData.lastName} ${studentData.firstName}
Группа: ${studentData.group}
Дата и время: ${studentData.startTime.toLocaleString('ru-RU')}

РЕЗУЛЬТАТЫ:
-----------
Правильных ответов: ${studentData.score} из ${studentData.totalQuestions}
Процент правильных: ${percentage}%
Время прохождения: ${minutes} мин ${seconds} сек

ОЦЕНКА:
-------
${getGrade(percentage)}

ДЕТАЛЬНАЯ ИНФОРМАЦИЯ:
--------------------
Всего вопросов: ${studentData.totalQuestions}
Правильно: ${studentData.score}
Неправильно: ${studentData.totalQuestions - studentData.score}
Пропущено: ${countUnanswered()}

================================
Тест завершён: ${studentData.endTime.toLocaleString('ru-RU')}
            `.trim();

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Результат_теста_${studentData.lastName}_${studentData.firstName}_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function sendResultsByEmail() {
            const percentage = Math.round((studentData.score / studentData.totalQuestions) * 100);
            const timeSpent = Math.round((studentData.endTime - studentData.startTime) / 1000);
            const minutes = Math.floor(timeSpent / 60);
            const seconds = timeSpent % 60;

            const subject = `Результаты теста - ${studentData.lastName} ${studentData.firstName} (${studentData.group})`;
            
            const body = `
РЕЗУЛЬТАТЫ ТЕСТА ПО ИНФОРМАТИКЕ
================================

Студент: ${studentData.lastName} ${studentData.firstName}
Группа: ${studentData.group}
Дата и время: ${studentData.startTime.toLocaleString('ru-RU')}

РЕЗУЛЬТАТЫ:
-----------
Правильных ответов: ${studentData.score} из ${studentData.totalQuestions}
Процент правильных: ${percentage}%
Время прохождения: ${minutes} мин ${seconds} сек
Оценка: ${getGrade(percentage)}

ДЕТАЛЬНАЯ ИНФОРМАЦИЯ:
--------------------
Всего вопросов: ${studentData.totalQuestions}
Правильно: ${studentData.score}
Неправильно: ${studentData.totalQuestions - studentData.score}
Пропущено: ${countUnanswered()}

================================
Тест завершён: ${studentData.endTime.toLocaleString('ru-RU')}
            `.trim();

            const mailtoLink = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoLink;
        }

        function getGrade(percentage) {
            if (percentage >= 90) return 'Отлично (5)';
            if (percentage >= 75) return 'Хорошо (4)';
            if (percentage >= 60) return 'Удовлетворительно (3)';
            return 'Неудовлетворительно (2)';
        }

        function countUnanswered() {
            let unanswered = 0;
            questions.forEach((question, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (!selected) unanswered++;
            });
            return unanswered;
        }
    </script>
</body>
</html>
